services:
  neo4j:
    image: neo4j:5-community
    container_name: wander-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (the Python driver)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-wanderwander}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
