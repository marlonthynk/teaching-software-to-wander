[project]
name = "teaching-software-to-wander"
version = "0.1.0"
description = "Companion experiment for the article 'Teaching Software to Wander Like We Do'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "chainlit>=2.0",
    "mcp>=1.2",
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
